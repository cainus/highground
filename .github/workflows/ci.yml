name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Tests, types, lint, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm fmt --check
      # Testcontainers starts Postgres through the runner's Docker.
      - run: pnpm coverage
        env:
          ORACLE_RUNS: "1000"

  bench:
    name: Latency (p99 < 10 ms)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm bench
